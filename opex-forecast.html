    <script type="text/babel">
      const summaryCards = [

      const numberFormatter = new Intl.NumberFormat("en-US", {

      const formatQuantity = (value) => numberFormatter.format(value);

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const railwayDefaults = {
        ram: 1,
        cpu: 0.5,
        egress: 1,
        storage: 5,
      };

      const railwayControls = [
        {
          key: "ram",
          label: "RAM",
          description: "Memory reserved for the app and backend runtime.",

          max: 1024,

        {
          key: "cpu",

      const svgDataUri = (svg) => `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;

      const lhcLogoSvg = svgDataUri(`

        "Every month without approval delays the LHC booking transition and keeps operations on manual or ad-hoc processes.",

      const businessValueCards = [

      const committeeLensCards = [

        "SMS messaging",

      const operatingAssumptionCards = [

        },

      const ownershipRows = [

      const riskRows = [

      const pricingRows = [

      const pricingSources = [

        ["Vercel", "https://vercel.com/docs/plans/pro-plan"],
        ["Vercel pricing", "https://vercel.com/docs/pricing"],
        ["Network Solutions", "https://www.networksolutions.com/domains"],
      ];

      function SectionHeading({ kicker, title, body }) {
        return (
          <div className="max-w-3xl">
            <p className="mb-3 text-xs font-semibold uppercase tracking-[0.28em] text-stone-600">{kicker}</p>
            <h2 className="headline text-3xl font-bold text-stone-900 md:text-4xl">{title}</h2>
            <p className="measure mt-4 text-base font-normal leading-[1.65] text-stone-700">{body}</p>
          </div>
        );
      }

      function MetricCard({ label, value, hint, accent = false }) {
        return (
          <div className={`soft-border rounded-[28px] p-5 shadow-soft ${accent ? "bg-[#111827] text-white" : "card-veil"}`}>

            <div className={`mt-4 text-4xl font-semibold tracking-tight ${accent ? "text-white" : "text-stone-900"}`}>{value}</div>
            <p className={`measure body-copy-sm mt-3 ${accent ? "text-stone-200" : "text-stone-600"}`}>{hint}</p>
          </div>
        );
      }

      function RailwayInputControl({ field, value, onChange }) {
        const sliderId = `${field.key}-slider`;
        const inputId = `${field.key}-input`;

        return (
          <div className="rounded-[24px] border border-stone-200 bg-white p-4 shadow-soft">
            <div className="flex items-start justify-between gap-4">
              <div>
                <label htmlFor={sliderId} className="text-sm font-semibold text-stone-900">
                  {field.label}
                </label>
                <p className="mt-1 text-sm text-stone-600">{field.description}</p>
              </div>
              <div className="shrink-0 rounded-full bg-stone-100 px-3 py-1 text-sm font-semibold text-stone-900">
                {formatQuantity(value)} <span className="font-medium text-stone-500">{field.unit}</span>
              </div>
            </div>
            <div className="mt-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_120px] sm:items-center">
              <input
                id={sliderId}
                type="range"
                min={field.min}
                max={field.max}
                step={field.step}
                value={value}
                aria-label={`${field.label} slider`}
                onChange={(event) => onChange(field.key, event.target.value)}
                className="h-2 w-full cursor-pointer accent-[#EAB41E]"
              />
              <input
                id={inputId}
                type="number"
                min={field.min}
                max={field.max}
                step={field.step}
                inputMode="decimal"
                value={value}
                aria-label={`${field.label} value`}
                onChange={(event) => onChange(field.key, event.target.value)}
                className="rounded-2xl border border-stone-300 bg-stone-50 px-3 py-2 text-sm font-semibold text-stone-900 focus:border-[#EAB41E] focus:outline-none focus:ring-2 focus:ring-[#EAB41E]/30"
              />
            </div>
          </div>
        );
      }

      function RailwayUsageCalculator() {
        const [railwayUsage, setRailwayUsage] = React.useState(railwayDefaults);

        const updateRailwayUsage = (key, rawValue) => {
          const parsedValue = Number.parseFloat(rawValue);

          if (Number.isNaN(parsedValue)) {
            return;
          }

          const field = railwayControls.find((item) => item.key === key);

          if (!field) {
            return;
          }

          setRailwayUsage((current) => ({
            ...current,
            [key]: clamp(parsedValue, field.min, field.max),
          }));
        };

        const monthlyUsageCost =
          railwayUsage.ram * 10 +
          railwayUsage.cpu * 20 +
          railwayUsage.egress * 0.05 +
          railwayUsage.storage * 0.15;
        const annualUsageCost = monthlyUsageCost * 12;
        const includedUsageCredit = 20;
        const annualIncludedUsageCredit = includedUsageCredit * 12;
        const monthlyNetCharge = Math.max(0, monthlyUsageCost - includedUsageCredit);
        const annualRailwayNetCharge = monthlyNetCharge * 12;
        const recurringRunRate = 240 + 240 + annualRailwayNetCharge + 34.99;
        const approvedAnnualBudget = 824.59;
        const recurringRunRateRounded = Math.round(recurringRunRate * 100) / 100;
        const approvedAnnualBudgetRounded = Math.round(approvedAnnualBudget * 100) / 100;
        const reserveRemaining = Math.max(0, approvedAnnualBudgetRounded - recurringRunRateRounded);
        const isOverBudget = recurringRunRateRounded > approvedAnnualBudgetRounded;
        const budgetStatus = isOverBudget ? "Out of budget" : "Within budget";
        const budgetStatusTone = isOverBudget ? "bg-rose-500/20 text-rose-200" : "bg-emerald-500/20 text-emerald-200";

        const summarySteps = [
          {
            step: "1",
            label: "Included usage credit",
            primary: `${formatCurrency(includedUsageCredit)}/month`,
            secondary: `${formatCurrency(annualIncludedUsageCredit)}/year`,
            note: "This is the allowance subtracted from Railway usage each month before the annual charge is rolled up.",
          },
          {
            step: "2",
            label: "Current usage before credit",
            primary: `${formatCurrency(monthlyUsageCost)}/month`,
            secondary: `${formatCurrency(annualUsageCost)}/year`,
            note: "Change the controls to see the monthly and yearly usage total update in real time.",
          },
          {
            step: "3",
            label: "Credit deduction",
            primary: `-${formatCurrency(includedUsageCredit)}/month`,
            secondary: `${formatCurrency(monthlyNetCharge)}/month net`,
            note: "The included credit is subtracted from the current usage, with a floor of $0 for the monthly Railway charge.",
          },
          {
            step: "4",
            label: "Annual Railway net usage charge",
            primary: `${formatCurrency(annualRailwayNetCharge)}/year`,
            secondary: "Monthly net charge x 12",
            note: "This is the annual Railway usage line that feeds the recurring run-rate.",
          },
        ];

        return (
          <div className="mt-5 soft-border rounded-[28px] bg-[#111827] p-5 text-white shadow-soft">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.28em] text-amber-200">Live calculator</p>
                <h3 className="mt-2 text-lg font-semibold text-white">Railway usage calculator</h3>
                <p className="measure body-copy-sm mt-2 text-stone-200">
                  Adjust the usage assumptions below to see the Railway cost path update in real time. The business case above stays on the current baseline.
                </p>
              </div>
              <span className="rounded-full bg-white/10 px-3 py-1 text-xs uppercase tracking-[0.18em] text-amber-200">
                Updates live
              </span>
            </div>

            <div className="mt-5 grid gap-5 lg:grid-cols-[1.05fr_0.95fr]">
              <div className="space-y-3">
                {railwayControls.map((field) => (
                  <RailwayInputControl
                    key={field.key}
                    field={field}
                    value={railwayUsage[field.key]}
                    onChange={updateRailwayUsage}
                  />
                ))}
              </div>

              <div className="rounded-[24px] border border-amber-300/20 bg-black/20 p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <p className="text-xs font-semibold uppercase tracking-[0.18em] text-amber-200">Budget status</p>
                    <h5 className="mt-2 text-base font-semibold text-white">Annual OPEX</h5>
                  </div>
                  <span className={`rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] ${budgetStatusTone}`}>
                    {budgetStatus}
                  </span>
                </div>

                {isOverBudget && (
                  <p className="mt-3 text-sm font-medium text-rose-200">
                    Recurring run-rate exceeds the approved annual budget.
                  </p>
                )}

                <div className="mt-4 grid gap-3 md:grid-cols-1">
                  <div className="rounded-[18px] border border-white/10 bg-white/5 p-4">
                    <p className="text-xs uppercase tracking-[0.16em] text-stone-300">Approved annual budget</p>
                    <div className="mt-2 text-2xl font-semibold tracking-tight text-white">
                      {formatCurrency(approvedAnnualBudgetRounded)}
                    </div>
                    <p className="mt-1 text-sm text-stone-300">Total approved OPEX covering infrastructure costs and a first-year operating reserve.</p>
                  </div>
                  <div className="rounded-[18px] border border-white/10 bg-white/5 p-4">
                    <p className="text-xs uppercase tracking-[0.16em] text-stone-300">Recurring run-rate</p>
                    <div className="mt-2 text-2xl font-semibold tracking-tight text-white">
                      {formatCurrency(recurringRunRateRounded)}
                    </div>
                    <p className="mt-1 text-sm text-stone-300">Baseline annual spend before reserve.</p>
                  </div>
                  <div className="rounded-[18px] border border-white/10 bg-white/5 p-4">
                    <p className="text-xs uppercase tracking-[0.16em] text-stone-300">Remaining reserve</p>
                    <div className="mt-2 text-2xl font-semibold tracking-tight text-white">
                      {formatCurrency(reserveRemaining)}
                    </div>
                    <p className="mt-1 text-sm text-stone-300">Approved annual budget minus the recurring run-rate.</p>
                  </div>
                </div>
              </div>
            </div>

              <div className="mt-5 rounded-[24px] border border-white/10 bg-white/5 p-4">
                <div className="flex items-center justify-between gap-3">
                  <h4 className="text-base font-semibold text-white">Live cost summary</h4>
                <span className="rounded-full bg-white/10 px-3 py-1 text-xs uppercase tracking-[0.18em] text-stone-200">
                  Computed now
                </span>
              </div>

              <p className="measure body-copy-sm mt-4 text-stone-200">
                Start with the included credit, compare it with the live usage, and subtract the credit to reach the annual Railway net usage charge.
              </p>

              <div className="mt-4 space-y-3">
                {summarySteps.map((item) => (
                  <div key={item.step} className="rounded-[22px] border border-white/10 bg-white/5 p-4">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div>
                        <p className="text-xs font-semibold uppercase tracking-[0.18em] text-amber-200">Step {item.step}</p>
                        <h5 className="mt-2 text-base font-semibold text-white">{item.label}</h5>
                      </div>
                      <div className="text-right">
                        <div className="text-2xl font-semibold tracking-tight text-white">{item.primary}</div>
                        <div className="mt-1 text-xs uppercase tracking-[0.16em] text-stone-300">{item.secondary}</div>
                      </div>
                    </div>
                    <p className="measure body-copy-sm mt-3 text-stone-200">{item.note}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      function RailwayPricingBasis() {
        return (
          <div className="mt-5 soft-border rounded-[28px] bg-white p-5 shadow-soft">
            <div className="flex items-center justify-between gap-3 text-lg font-semibold text-stone-900">
              <h3>Pricing basis</h3>
              <span className="rounded-full bg-[#FCEEC8] px-3 py-1 text-xs uppercase tracking-[0.18em] text-stone-700">Review</span>

                  <tr>
                    <th className="px-4 py-3 font-semibold">Item</th>
                    <th className="px-4 py-3 font-semibold">Price / limit</th>
                    <th className="px-4 py-3 font-semibold">Use in this forecast</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-200">
                  {pricingRows.map((row) => (
                    <tr key={row[0]}>
                      {row.map((cell) => (
                        <td key={cell} className="px-4 py-3 text-stone-700">
                          {cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-4 grid gap-3 md:grid-cols-2">
              {pricingSources.map(([vendor, url]) => (
                <a
                  key={vendor}
                  href={url}
                  target="_blank"
                  rel="noreferrer"
                  className="soft-border rounded-[20px] bg-stone-50 p-4 text-sm text-stone-700 transition hover:bg-stone-100"
                >
                  <div className="text-xs font-semibold uppercase tracking-[0.18em] text-stone-500">{vendor}</div>
                  <div className="mt-2 break-all text-sm text-stone-900">{url}</div>
                </a>
              ))}
            </div>
          </div>
        );
      }

      function App() {
